name: CI pour les pull request dans develop

on:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-22.04

    environment: develop

    env:
      APP_NAME: waxci-web-frontend-develop
      NODE_ENV: production

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image localement
        run: |
          docker build --target prod -t ${{ env.APP_NAME }}:test .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:latest
            ${{ vars.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:${{ github.sha }}
            ${{ vars.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:${{ github.ref_name }}
